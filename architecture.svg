<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="19" font-weight="600" fill="#0f172a">Kafka Order Processing Pipeline</text>
  <text x="40" y="64" font-size="13" fill="#64748b">Avro serialization · running average · retry with backoff · dead letter queue</text>

  <!-- Schema Registry -->
  <rect x="330" y="100" width="250" height="66" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="455" y="127" font-size="14.5" font-weight="600" fill="#5b21b6" text-anchor="middle">Schema Registry</text>
  <text x="455" y="148" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#7c3aed" text-anchor="middle">subject: orders-value</text>

  <!-- Dashed links to Schema Registry -->
  <path d="M 150 248 L 335 168" fill="none" stroke="#7c3aed" stroke-width="1.6"
        stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="150" y="196" font-size="11.5" fill="#7c3aed">register</text>
  <text x="150" y="211" font-size="11.5" fill="#7c3aed">+ serialize</text>

  <path d="M 790 248 L 578 168" fill="none" stroke="#7c3aed" stroke-width="1.6"
        stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="700" y="196" font-size="11.5" fill="#7c3aed">fetch schema</text>
  <text x="700" y="211" font-size="11.5" fill="#7c3aed">by ID</text>

  <!-- Producer -->
  <rect x="40" y="248" width="180" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="130" y="276" font-size="14" font-weight="600" font-family="Consolas, Menlo, monospace" fill="#0f172a" text-anchor="middle">producer.py</text>
  <text x="130" y="297" font-size="11.5" fill="#64748b" text-anchor="middle">generates orders</text>

  <!-- Topic: orders -->
  <rect x="330" y="248" width="250" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="455" y="276" font-size="14" font-weight="600" font-family="Consolas, Menlo, monospace" fill="#1e3a8a" text-anchor="middle">topic: orders</text>
  <text x="455" y="297" font-size="11.5" fill="#2563eb" text-anchor="middle">1 partition · append-only log</text>

  <!-- Consumer -->
  <rect x="690" y="248" width="190" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="785" y="276" font-size="14" font-weight="600" font-family="Consolas, Menlo, monospace" fill="#0f172a" text-anchor="middle">consumer.py</text>
  <text x="785" y="297" font-size="11.5" fill="#64748b" text-anchor="middle">running average · retry</text>

  <!-- Producer -> orders -->
  <line x1="220" y1="283" x2="322" y2="283" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="271" y="274" font-size="11.5" fill="#334155" text-anchor="middle">Avro</text>

  <!-- orders -> consumer -->
  <line x1="580" y1="283" x2="682" y2="283" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="631" y="274" font-size="11.5" fill="#334155" text-anchor="middle">Avro</text>

  <!-- consumer -> DLQ -->
  <line x1="785" y1="318" x2="785" y2="378" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="770" y="342" font-size="11.5" fill="#dc2626" text-anchor="end">retries exhausted</text>
  <text x="770" y="357" font-size="11.5" fill="#dc2626" text-anchor="end">or permanent error</text>

  <!-- DLQ -->
  <rect x="655" y="378" width="255" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="782" y="406" font-size="14" font-weight="600" font-family="Consolas, Menlo, monospace" fill="#991b1b" text-anchor="middle">topic: orders-dlq</text>
  <text x="782" y="427" font-size="11.5" fill="#dc2626" text-anchor="middle">JSON payload + error headers</text>

  <!-- Aggregation note -->
  <rect x="40" y="378" width="290" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="185" y="406" font-size="13.5" font-weight="600" fill="#166534" text-anchor="middle">Running average</text>
  <text x="185" y="427" font-size="11.5" fill="#16a34a" text-anchor="middle">total / count, committed per message</text>

  <path d="M 700 322 L 338 380" fill="none" stroke="#16a34a" stroke-width="1.6"
        stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="530" y="342" font-size="11.5" fill="#16a34a" text-anchor="middle">on success</text>

</svg>
